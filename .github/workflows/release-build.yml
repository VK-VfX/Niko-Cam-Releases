name: Build and release

# Builds the private source (VK-VfX/Niko-Cam-Plus), signs it with the release key stored in THIS repository's
# secrets, and publishes the APK and version.json to this repository's never-spiral-apk-builds branch, which is
# where the installed app's updater reads from. Started by hand only: there is no push or pull-request trigger.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or commit of Niko-Cam-Plus to build (required; it must contain ci/read-version.sh)"
        type: string
        required: true
      notes:
        description: "Release notes shown in the app's update card"
        type: string
        default: ""
      publish:
        description: "Publish to the update channel (off = build and verify only)"
        type: boolean
        default: true
      expect_cert:
        description: "Refuse unless the signing certificate SHA-256 starts with this (lowercase hex, no colons). Empty = no check"
        type: string
        default: "5d1eb0a92fdf"

permissions:
  contents: write

concurrency:
  group: release-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check secrets
        env:
          SOURCE_TOKEN: ${{ secrets.SOURCE_TOKEN }}
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          missing=""
          for v in SOURCE_TOKEN KEYSTORE_B64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            [ -z "${!v}" ] && missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing"
            exit 1
          fi

      - name: Check out the source (private)
        uses: actions/checkout@v4
        with:
          repository: VK-VfX/Niko-Cam-Plus
          ref: ${{ inputs.ref }}
          token: ${{ secrets.SOURCE_TOKEN }}
          path: src
          persist-credentials: false

      # One tested reader for the version (ci/test-read-version.sh runs in the source repo's Android Build).
      # It fails on a missing or duplicated versionCode/versionName.
      - name: Read the app version
        id: ver
        working-directory: src
        run: |
          bash ci/read-version.sh app/build.gradle.kts | tee "$RUNNER_TEMP/version.txt"
          cat "$RUNNER_TEMP/version.txt" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            src/**/*.gradle*
            src/**/gradle-wrapper.properties

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Prepare release signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          {
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.keystore"
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "KEY_ALIAS=$KEY_ALIAS"
            echo "KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Run unit tests
        working-directory: src
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest --stacktrace

      - name: Build release APK
        working-directory: src
        run: ./gradlew assembleRelease --stacktrace

      # The APK that was actually built must be the app and the version the source says it is.
      - name: Verify the APK package and version (aapt2 badging)
        env:
          WANT_CODE: ${{ steps.ver.outputs.versionCode }}
          WANT_NAME: ${{ steps.ver.outputs.versionName }}
        run: |
          APK=src/app/build/outputs/apk/release/app-release.apk
          BADGING=$("$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging "$APK" | grep -m1 '^package:')
          echo "$BADGING"
          PKG=$(sed -nE "s/.* name='([^']*)'.*/\1/p" <<< "$BADGING")
          CODE=$(sed -nE "s/.* versionCode='([^']*)'.*/\1/p" <<< "$BADGING")
          NAME=$(sed -nE "s/.* versionName='([^']*)'.*/\1/p" <<< "$BADGING")
          if [ "$PKG" != "com.nikoezveracamspiral" ]; then
            echo "::error::APK package is '$PKG', expected com.nikoezveracamspiral."
            exit 1
          fi
          if [ "$CODE" != "$WANT_CODE" ] || [ "$NAME" != "$WANT_NAME" ]; then
            echo "::error::APK is $NAME ($CODE) but build.gradle.kts says $WANT_NAME ($WANT_CODE)."
            exit 1
          fi

      # A real publish must move the channel forward. An unreachable version.json fails a real publish (we cannot
      # prove the version is newer); a 404 means nothing was ever published, which is allowed. A dry run only warns.
      - name: Check the version is newer than the live one
        env:
          NEW_CODE: ${{ steps.ver.outputs.versionCode }}
          PUBLISH: ${{ inputs.publish }}
          REPO: ${{ github.repository }}
        run: |
          problem() {
            if [ "$PUBLISH" = "true" ]; then echo "::error::$1"; exit 1; else echo "::warning::$1 (dry run, continuing)"; exit 0; fi
          }
          URL="https://raw.githubusercontent.com/${REPO}/never-spiral-apk-builds/version.json?nocache=$(date +%s)"
          HTTP=$(curl -sS --max-time 30 --retry 3 --retry-all-errors -o "$RUNNER_TEMP/live.json" -w '%{http_code}' "$URL") || HTTP="000"
          if [ "$HTTP" = "404" ]; then
            echo "No live version.json (HTTP 404): treating this as the first publish."
            exit 0
          fi
          if [ "$HTTP" != "200" ]; then
            problem "Could not read the live version.json (HTTP $HTTP), so the new versionCode cannot be compared."
          fi
          LIVE=$(jq -r '.versionCode // empty' "$RUNNER_TEMP/live.json" 2>/dev/null || true)
          if ! [[ "$LIVE" =~ ^[0-9]+$ ]]; then
            problem "The live version.json has no numeric versionCode."
          fi
          echo "Live versionCode $LIVE, new versionCode $NEW_CODE"
          if [ "$NEW_CODE" -le "$LIVE" ]; then
            problem "versionCode $NEW_CODE is not strictly greater than the live $LIVE."
          fi

      # Never publish a build signed with the committed debug key: installed apps could not update to it.
      - name: Verify the signing key
        id: sign
        env:
          EXPECT: ${{ inputs.expect_cert }}
        run: |
          APK=src/app/build/outputs/apk/release/app-release.apk
          CERT=$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$APK" | grep -i "Signer #1 certificate SHA-256" | awk '{print $NF}')
          echo "Signer certificate SHA-256: $CERT"
          echo "cert=$CERT" >> "$GITHUB_OUTPUT"
          if [ "$CERT" = "0bfdc596c3316323327e48aef5a9e1bb8770a72d92b03af62dbb524c6d90cb72" ]; then
            echo "::error::The APK is signed with the debug key; refusing to publish."
            exit 1
          fi
          if [ -n "$EXPECT" ] && [[ "$CERT" != "$EXPECT"* ]]; then
            echo "::error::Signing certificate $CERT does not start with the expected $EXPECT; refusing to publish."
            exit 1
          fi

      - name: Upload the APK as a run artifact
        uses: actions/upload-artifact@v4
        with:
          name: niko-cam-release-apk
          path: src/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 3

      # This repository (public) holds CHANGELOG.md, which becomes the GitHub Release body.
      - name: Check out this repository (changelog)
        uses: actions/checkout@v4
        with:
          path: rel
          persist-credentials: false

      # A dry run never publishes, so a missing changelog section is only a warning here; a real publish fails below.
      - name: Check the changelog has this version (dry run)
        if: ${{ !inputs.publish }}
        env:
          VERSION_NAME: ${{ steps.ver.outputs.versionName }}
        run: |
          # Literal prefix match (no regex), so the dots in the version are not wildcards.
          if ! awk -v h="## [${VERSION_NAME}]" 'substr($0, 1, length(h)) == h { found = 1 } END { exit !found }' rel/CHANGELOG.md; then
            echo "::warning::CHANGELOG.md has no '## [${VERSION_NAME}]' section; a real publish would fail."
          fi

      # Sole publisher. Order matters: the signing check above has already passed. The tag is checked before anything
      # is pushed so an existing release is never overwritten; the single-commit branch is what installed apps read,
      # and the v<versionName> tag plus release asset are the rollback trail (the tag keeps the pushed commit reachable).
      - name: Publish to the update channel
        if: ${{ inputs.publish }}
        env:
          NOTES: ${{ inputs.notes }}
          REPO: ${{ github.repository }}
          PUSH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION_CODE: ${{ steps.ver.outputs.versionCode }}
          VERSION_NAME: ${{ steps.ver.outputs.versionName }}
        run: |
          TAG="v${VERSION_NAME}"
          if gh api "repos/${REPO}/git/ref/tags/${TAG}" > /dev/null 2>&1; then
            echo "::error::Tag ${TAG} already exists; refusing to publish over it."
            exit 1
          fi
          # Literal prefix match (no regex), so the dots in the version are not wildcards. Checked before any push.
          HEADING="## [${VERSION_NAME}]"
          if ! awk -v h="$HEADING" 'substr($0, 1, length(h)) == h { found = 1 } END { exit !found }' rel/CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '${HEADING}' section; add it before publishing."
            exit 1
          fi
          awk -v h="$HEADING" 'substr($0, 1, length(h)) == h { grab = 1; next } grab && substr($0, 1, 4) == "## [" { exit } grab' \
            rel/CHANGELOG.md > /tmp/release-notes.md
          if [ -n "$NOTES" ]; then
            printf '\n### Release notes\n\n%s\n' "$NOTES" >> /tmp/release-notes.md
          fi
          mkdir -p /tmp/out && cp src/app/build/outputs/apk/release/app-release.apk /tmp/out/niko-cam-release.apk
          SHA=$(sha256sum /tmp/out/niko-cam-release.apk | cut -d' ' -f1)
          BASE="https://raw.githubusercontent.com/${REPO}/never-spiral-apk-builds"
          jq -n --argjson code "$VERSION_CODE" --arg name "$VERSION_NAME" --arg url "$BASE/niko-cam-release.apk" \
            --arg sha "$SHA" --arg notes "$NOTES" \
            '{versionCode:$code, versionName:$name, apkUrl:$url, sha256:$sha, notes:$notes}' > /tmp/out/version.json
          cd /tmp/out
          git init -q -b never-spiral-apk-builds
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add niko-cam-release.apk version.json
          git commit -q -m "Niko's Cam ${VERSION_NAME} (${VERSION_CODE})"
          git push --force "https://x-access-token:${PUSH_TOKEN}@github.com/${REPO}.git" HEAD:never-spiral-apk-builds
          cp niko-cam-release.apk "niko-cam-${VERSION_NAME}.apk"
          gh release create "$TAG" "niko-cam-${VERSION_NAME}.apk" version.json \
            --repo "$REPO" --target "$(git rev-parse HEAD)" \
            --title "Niko's Cam ${VERSION_NAME}" --notes-file /tmp/release-notes.md
          echo "Published ${VERSION_NAME} (${VERSION_CODE}), tag ${TAG}, signer ${{ steps.sign.outputs.cert }}" >> "$GITHUB_STEP_SUMMARY"
